name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies (SUMO comes as a pip wheel)
        run: pip install -r requirements-train.txt
      - name: Run tests (policy, demand, junction model, safety invariants, evaluation helpers)
        run: python -m pytest -q

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Control room in a real browser (3 widths, every data file, playback, no console errors)
        run: python tools/site_check.py
